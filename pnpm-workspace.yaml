packages:
  - "apps/*"
  - "jobs/*"
  - "packages/*"

strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    # vite-tsconfig-paths uses tsconfck 3, which declares typescript ^5 but works
    # with 6. Drop this once tsconfck widens its peer range
    tsconfck>typescript: "6"

allowBuilds:
  "@swc/core": true
  esbuild: true

catalog:
  "@total-typescript/tsconfig": ^1.0.4
  "@trpc/client": ^11.29.2
  "@trpc/server": ^11.29.2
  "@trpc/tanstack-react-query": ^11.29.2
  "@types/node": ^24.19.2
  date-fns: ^4.4.0
  dotenv: ^18.0.10
  superjson: ^2.2.6
  tsdown: ^0.23.7
  tsx: ^4.23.15
  typescript: ^6.0.3
  vite: ^8.3.8
  vitest: ^5.1.0
  zod: ^4.6.5
