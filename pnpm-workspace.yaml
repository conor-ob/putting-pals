packages:
  - "apps/*"
  - "jobs/*"
  - "packages/*"

allowBuilds:
  esbuild: true

overrides:
  # uniwind@1.12.0's Metro web wrapper has no InputAccessoryView implementation,
  # which breaks `expo export -p web` on react-native-web 0.21.3+.
  # https://github.com/uni-stack/uniwind/issues/695 - remove once uniwind ships the fix (PR #697).
  react-native-web: 0.21.2

catalog:
  "@total-typescript/tsconfig": ^1.0.4
  "@trpc/client": ^11.19.0
  "@trpc/server": ^11.19.0
  "@trpc/tanstack-react-query": ^11.19.0
  "@types/node": ^24.19.0
  date-fns: ^4.4.0
  dotenv: ^18.0.4
  superjson: ^2.2.6
  typescript: ^6.0.3
  vitest: ^5.0.2
  zod: ^4.6.5

minimumReleaseAgeExclude:
  - "@expo/ui@57.0.21"
  - "@react-navigation/bottom-tabs@7.20.0"
  - "@react-navigation/core@7.23.0"
  - "@react-navigation/elements@2.9.44"
  - "@react-navigation/native@7.5.0"
  - expo-constants@57.0.20
  - expo-modules-core@57.0.20
  - expo-router@57.0.24
  - expo@57.0.26
  - railway@3.12.0
