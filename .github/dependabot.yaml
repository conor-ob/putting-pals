# Dependabot baseline. Source of truth: conor-ob/hq templates/dependabot/dependabot.yaml
# Policy and reasons: conor-ob/hq docs/dependabot.md
#
# Copy to .github/dependabot.yaml.
# Keep the baseline entries as they are. Repo-specific changes go under
# "Repo exceptions" comments, so a diff against the template shows only them.
version: 2

updates:
  # One entry per pnpm workspace, at the workspace root. It covers every
  # package in the workspace and the catalogs in pnpm-workspace.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Dublin
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      # Repo exceptions: these groups come before minor-and-patch, because an
      # update joins the first group it matches. They aren't auto-merged.
      # Expo SDK packages move together, so review them as one PR
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react-native"
          - "react-native-*"
      # Storybook fails to install unless all its packages share a version
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      # Majors stay out of the group, so each one gets its own PR.
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      # Without prefix-development, dev dependencies use this prefix too.
      prefix: chore
      include: scope
    # Repo exceptions: deliberate ignores
    ignore:
      # Pinned to the Expo SDK by `expo install`, and web pins the same react.
      # Upgrade these with an SDK bump (`npx expo install --fix`) instead
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      # The Expo SDK pins these to exact versions, so even patch bumps break
      # `expo install --check`. They move with an SDK bump too
      - dependency-name: "@shopify/flash-list"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      # Expo SDK 57 expects typescript ~6.0.3; CI runs `expo install --check typescript`
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Ionic sets the router version (`@ionic/react-router` 9 needs
      # react-router 6), so the major moves with an Ionic upgrade
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      # Types must match the Node runtime (node:24 images, engines >=24.19), so
      # the major moves with the Docker node image instead
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # graphql-request 7 (used at runtime by pga-tour-api) only supports
      # graphql 14 - 16. Drop this once graphql-request supports 17
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      # Expo SDK minors and majors move with an SDK bump (see expo-sdk-check.yaml)
      - dependency-name: "expo"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Dublin
    cooldown:
      default-days: 7
    groups:
      # Majors stay out of the group, so each one gets its own PR.
      github-actions:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
      include: scope

  # Add when the repo has a Dockerfile. List every directory that has one.
  - package-ecosystem: docker
    directories:
      - /apps/expo
      - /apps/server
      - /apps/web
      - /jobs/espn-schema
      - /jobs/leaderboard-sync
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Dublin
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
    commit-message:
      prefix: build
      include: scope
    # Repo exceptions: deliberate ignores
    ignore:
      # Node majors are moved deliberately, to the next LTS, alongside engines
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Add when the repo has compose files. List every directory that has one.
  - package-ecosystem: docker-compose
    directories:
      - /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Dublin
    cooldown:
      default-days: 7
    groups:
      docker-compose:
        patterns:
          - "*"
    commit-message:
      prefix: build
      include: scope
    # Repo exceptions: deliberate ignores
    ignore:
      # Postgres majors need a data upgrade, and must match Railway and CI
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
