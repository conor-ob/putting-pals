name: 🚂 Railway plan

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".railway/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: 📋 Plan
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # railway.ts imports railway/iac, but railwayapp/config always runs
      # `npm install` at the repo root, and npm can't parse `catalog:` or
      # `workspace:*`. Install with pnpm, then hide package.json so the npm step
      # no-ops
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Hide package.json from npm
        run: mv package.json package.json.bak

      - name: Railway config plan
        uses: railwayapp/config@v1
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
