name: 🚂 Railway plan

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".railway/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: 📋 Plan
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # railway.ts imports railway/iac, but railwayapp/config always runs
      # `npm install` at the repo root, and npm can't parse `catalog:` or
      # `workspace:*`. Install with pnpm, then hide package.json so the npm step
      # no-ops
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Hide package.json from npm
        run: mv package.json package.json.bak

      - name: Railway config plan
        uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
