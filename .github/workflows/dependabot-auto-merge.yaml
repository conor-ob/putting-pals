# Dependabot auto-merge baseline. Source of truth: conor-ob/hq templates/dependabot/dependabot-auto-merge.yaml
# Policy, reasons and App setup: conor-ob/hq docs/dependabot.md
#
# Copy to .github/workflows/dependabot-auto-merge.yaml.
# Needs the Dependabot secrets AUTOMERGE_APP_CLIENT_ID and AUTOMERGE_APP_PRIVATE_KEY.
#
# Turns on auto-merge (squash) for grouped version updates that are not
# majors. GitHub merges the PR once the required checks in the protect-main
# ruleset pass. Majors and security updates are left for a hand merge.
#
# The merge uses a GitHub App token, not GITHUB_TOKEN, so the merge commit on
# main starts push workflows (CI) and gives Railway check suites to wait for.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Security updates aren't grouped (groups apply to version updates unless
      # they set applies-to: security-updates, and none of ours do), so
      # dependency-group is empty for them and they never match.
      # update-type is the highest change in the PR, so a group holding a major
      # is held back too. Docker digest updates have no semver change and pass.
      - name: Check policy
        id: policy
        if: >-
          contains(fromJSON('["minor-and-patch", "github-actions", "docker", "docker-compose"]'), steps.metadata.outputs.dependency-group)
          && steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: echo "eligible=true" >> "$GITHUB_OUTPUT"

      # workflows: write lets the App merge PRs that change files in
      # .github/workflows, which every github-actions update does.
      - name: Create App token
        id: app-token
        if: steps.policy.outputs.eligible == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Enable auto-merge
        if: steps.policy.outputs.eligible == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
