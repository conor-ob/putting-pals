name: 📱 Expo SDK check

# Dependabot ignores Expo SDK majors (they need `expo install --fix` and a
# TypeScript move), so open an issue when a new SDK is released instead
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: 🔎 Check for a new SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Open an issue if a new SDK is out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(jq -r '.dependencies.expo' apps/expo/package.json | sed -E 's/^[^0-9]*([0-9]+).*/\1/')
          latest=$(npm view expo dist-tags.latest)
          latest_major=${latest%%.*}
          echo "Current SDK: $current, latest expo: $latest"

          if [ "$latest_major" -le "$current" ]; then
            echo "Already on the latest SDK"
            exit 0
          fi

          # Search closed issues too, so closing one as "not now" stops repeats
          title="Upgrade to Expo SDK $latest_major"
          existing=$(gh issue list --state all --search "\"$title\" in:title" --json title \
            --jq "map(select(.title == \"$title\")) | length")
          if [ "$existing" -gt 0 ]; then
            echo "An issue for SDK $latest_major already exists"
            exit 0
          fi

          cat > body.md <<EOF
          Expo SDK $latest_major is out (\`expo@$latest\`). We're on SDK $current.

          Dependabot ignores Expo SDK majors, so this needs a manual upgrade:

          1. Read the [changelog](https://expo.dev/changelog) for breaking changes.
          2. In \`apps/expo\`, run \`npx expo install expo@^$latest_major\`, then \`npx expo install --fix\`.
          3. If the SDK moves TypeScript, update the \`typescript\` catalog entry and the SDK comment in \`.github/dependabot.yaml\`.
          4. Check that \`npx expo install --check\` and CI pass.
          EOF
          gh issue create --title "$title" --label dependencies --body-file body.md
