name: ⚡️ CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded PR runs only: with checkSuites on, Railway waits for every
# main commit's CI to finish before deploying it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ⚡️ CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: putting-pals
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # What the apps' .env files would provide. dotenv never overrides
    # variables that are already set, so CI needs no .env files
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/putting-pals
      PORT: "4000"
      ORIGIN: http://localhost:8081
      EXPO_PUBLIC_SERVER_URL: http://localhost:4000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Codegen
        id: setup
        run: pnpm codegen

      # Checks below run even if an earlier one fails, so one run reports every
      # failure. They still skip if any setup step above failed
      - name: Check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm biome ci .

      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm typecheck

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm build

      - name: Test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm test

      - name: Check migration journal
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/putting-pals-db
        run: pnpm drizzle-kit check

      - name: Check schema has no ungenerated changes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/putting-pals-db
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::schema.ts has changes without a migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi

      # Same entry point Railway runs as the server pre-deploy command
      - name: Apply migrations to empty database
        id: migrate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: apps/server
        run: node dist/migrate.mjs

      - name: Re-apply migrations (no-op)
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        working-directory: apps/server
        run: node dist/migrate.mjs
